[model]
preset = "extra-small-gqa"
context_length = 4096
repeat_blocks = true

[data]
path = "../../../../Datasets/itsyllm/sangraha_ultrafineweb_5m_10092026.bin"
tokenizer = "../../artifacts/tokenizers/sangraha_ultrafineweb_l3_en_indic_unigram_v1"
num_workers = 2

[training]
max_train_tokens = 2_500_000_000
batch_size = 8
gradient_accumulation_steps = 4
seed = 1337
activation_checkpointing = true
compile_model = true

[optimizer]
name = "adamw8bit"
learning_rate = 3e-4
weight_decay = 0.1
betas = [0.9, 0.95]
eps = 1e-8

[scheduler]
name = "cosine"
min_learning_rate = 3e-5
warmup_tokens = 50_000_000

[checkpointing]
output_dir = "../../artifacts/checkpoints/extra_small_gqa_4096_v2"
save_every_tokens = 100_000_000

[logging]
log_every_tokens = 1_000_000
wandb_mode = "online"
wandb_project = "itsyllm"
wandb_run_name = "extra-small-gqa-4096-v2-repeat-blocks"
